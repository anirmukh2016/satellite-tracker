<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISS Tracker Blog</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root{
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-dim: #5f5f5f;
      --border: #dcdcdc;
      --link: #1a5fb4;
      --code-bg: #f3f3f3;
      --quote-bg: #eaf1fb;
      --quote-border: #7fa8d8;
      --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    *,*::before,*::after{ box-sizing: border-box; }
    body{
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.65;
    }

    .site-nav{
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 760px;
      margin: 0 auto;
    }
    .site-nav .brand{ font-weight: 700; font-size: 15px; color: var(--text); text-decoration: none; }
    .site-nav a.app-link{ color: var(--text); text-decoration: none; font-size: 13px; }
    .site-nav a.app-link:hover{ color: var(--link); }

    #post{
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px 80px;
      overflow-wrap: break-word;
    }

    #post .loading{ color: var(--text-dim); font-size: 14px; }

    #post h1{
      font-size: 30px;
      font-weight: 700;
      line-height: 1.25;
      margin: 0 0 8px;
    }
    /* The first line after the H1 in blog.md is an italic byline. */
    #post h1 + p em{
      display: block;
      font-style: normal;
      color: var(--text-dim);
      font-size: 13.5px;
      margin-bottom: 30px;
    }
    #post h2{
      font-size: 20px;
      font-weight: 700;
      margin: 34px 0 12px;
    }
    #post p{ margin: 0 0 14px; }
    #post a{ color: var(--link); }
    #post ul, #post ol{ margin: 0 0 14px; padding-left: 22px; }
    #post li{ margin-bottom: 5px; }

    #post code{
      font-family: var(--mono);
      font-size: 0.88em;
      background: var(--code-bg);
      padding: 1px 5px;
      border-radius: 3px;
    }
    #post pre{
      background: var(--code-bg);
      border-radius: 4px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 0 0 18px;
    }
    #post pre code{ background: none; padding: 0; font-size: 12.5px; line-height: 1.6; }

    #post table{
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0 20px;
      font-size: 14px;
    }
    #post th, #post td{
      border: 1px solid var(--border);
      padding: 6px 10px;
      text-align: left;
    }
    #post th{ background: #fafafa; font-weight: 600; }

    /* Any blockquote in the Markdown becomes a soft-tinted callout —
       no special admonition syntax needed. */
    #post blockquote{
      background: var(--quote-bg);
      border-left: 3px solid var(--quote-border);
      border-radius: 4px;
      margin: 18px 0;
      padding: 10px 16px;
      font-size: 14.5px;
    }
    #post blockquote p:last-child{ margin-bottom: 0; }

    #post hr{
      border: none;
      border-top: 1px solid var(--border);
      margin: 36px 0 16px;
    }

    @media (max-width: 600px){
      .site-nav{ padding: 12px 16px; }
      #post{ padding: 28px 16px 60px; }
    }
  </style>
</head>
<body>
  <div class="site-nav">
    <a class="brand" href="/">satellite-tracker</a>
    <a class="app-link" href="/">&larr; Back to the live tracker</a>
  </div>

  <div id="post">
    <p class="loading">Loading&hellip;</p>
  </div>

  <script>
    fetch('/blog.md')
      .then(function (res) {
        if (!res.ok) throw new Error('Could not load blog.md (' + res.status + ')');
        return res.text();
      })
      .then(function (markdown) {
        var html = marked.parse(markdown);
        var container = document.getElementById('post');
        container.innerHTML = html;

        var h1 = container.querySelector('h1');
        if (h1) document.title = h1.textContent;
      })
      .catch(function (err) {
        document.getElementById('post').innerHTML =
          '<p class="loading">Sorry, the post could not be loaded (' +
          (err && err.message ? err.message : 'unknown error') +
          ').</p>';
      });
  </script>
</body>
</html>
